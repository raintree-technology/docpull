name: Publish to MCP Registry

on:
  workflow_call:
    inputs:
      version:
        description: "Version successfully published by the PyPI workflow"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, matching pyproject.toml and server.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A called workflow inherits github.workflow; keep this separate from PyPI.
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Verify registry metadata version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]

          with open("server.json", "r", encoding="utf-8") as handle:
              server = json.load(handle)

          server_version = server["version"]
          package_version = server["packages"][0]["version"]
          requested_version = os.environ["REQUESTED_VERSION"]

          versions = {
              "requested": requested_version,
              "pyproject.toml": project_version,
              "server.json": server_version,
              "server.json package": package_version,
          }
          print(versions)
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Version mismatch: {versions}")
          PY

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 31); do
            if output=$(./mcp-publisher publish server.json 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              publish_status=$?
            fi
            printf '%s\n' "$output"
            # The registry may still see a cached PyPI 404 after upload succeeds.
            if [[ "$output" != *"PyPI package 'docpull' exists, but version '${VERSION}' was not found (status: 404)"* ]]; then
              exit "$publish_status"
            fi
            if [ "$attempt" = 31 ]; then
              echo "::error::MCP Registry still cannot see docpull ${VERSION} on PyPI after 31 attempts."
              exit 1
            fi
            echo "Waiting for PyPI propagation before retrying MCP registration (${attempt}/31)."
            sleep 20
          done
